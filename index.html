<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Directory</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #f4f6f8;
        color: #263238;
        font-family: Arial, sans-serif;
      }

      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 1.5rem;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 0.8rem;
        border-bottom: 1px solid #e0e4e7;
        text-align: left;
      }

      th {
        background: #eef2f5;
      }

      tbody tr:hover {
        background: #f8fafb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Team Directory</h1>
      <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Role</th>
            <th scope="col">Department</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Alex Morgan</td>
            <td>Designer</td>
            <td>Product</td>
          </tr>
          <tr>
            <td>Jordan Lee</td>
            <td>Developer</td>
            <td>Engineering</td>
          </tr>
          <tr>
            <td>Sam Taylor</td>
            <td>Project Manager</td>
            <td>Operations</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
